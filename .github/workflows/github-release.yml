name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish'
        type: string
        required: true
      draft:
        description: 'Draft'
        type: boolean
        default: true
        required: true

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          FLAGS=""
          if [ "$DRAFT" = 'true' ]; then FLAGS="$FLAGS --draft"; fi
          # A tag carrying a prerelease suffix (v4.0.0-rc.1) is marked as one,
          # which also keeps GitHub from labelling it the latest release.
          case "$RELEASE_TAG" in
            *-*) FLAGS="$FLAGS --prerelease" ;;
          esac
          git show -s --format=%b | \
          gh release create "$RELEASE_TAG" \
              --repo="$GITHUB_REPOSITORY" \
              --title="Version ${RELEASE_TAG#v}" \
              --verify-tag \
              $FLAGS \
              -F -
