name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish'
        type: choice
        required: true
        options:
          # The leading word of each label is the bump keyword, extracted in the
          # "Setup versions" step below and resolved into `npm version` arguments
          # by scripts/get-version-bump.js. Keep the keyword first when editing
          # a label, and keep it a name that script accepts.
          - 'patch (x.y.z+1, bug fixes)'
          - 'minor (x.y+1.0, new functionality)'
          - 'major (x+1.0.0, api breaking changes)'
          - 'prepatch (x.y.z+1-rc.0, patch release candidate)'
          - 'preminor (x.y+1.0-rc.0, minor release candidate)'
          - 'premajor (x+1.0.0-rc.0, major release candidate)'
          - 'prerelease (x.y.z-rc.N+1, next release candidate)'
          - 'release (x.y.z, promote the current release candidate to final)'
      dry_run:
        description: 'Dry run (perform all steps except git push & npm publish)'
        type: boolean
        default: true
        required: true
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
        required: true
jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      # actions/checkout sets up push credentials but no committer identity, and
      # the runner has no name for git to fall back on, so the commits made by
      # `npm version` and the changelog amend would fail with "empty ident name".
      - name: Configure git identity
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Setup versions in ${{ '${{env}}' }}
        env:
          VERSION_LABEL: ${{ inputs.version }}
        run: |
          node scripts/get-publish-versions.js >> "$GITHUB_ENV"
          echo "SEMVER_UPDATE=${VERSION_LABEL%% *}" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"
      - name: Version package
        id: bump
        run: |
          BUMP="$(node scripts/get-version-bump.js "$SEMVER_UPDATE")"
          npm version $BUMP
          VERSION="$(git show -s --format=%s)"
          # npm's version commit subject is the bare version number. Anything
          # else means the bump didn't happen, and we'd go on to tag and publish
          # the wrong commit.
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::expected a version commit, got '$VERSION'"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # $GITHUB_ENV doesn't cross job boundaries; the github-release job
          # needs the tag, so publish it as a job output too.
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Prereleases go out under the `rc` dist-tag so that plain
          # `npm install jschardet` keeps resolving to the latest stable release.
          case "$VERSION" in
            *-*) echo "NPM_DIST_TAG=rc" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - name: Amend with changelog
        run: |
          # Promoting a release candidate reports against the last stable
          # release, so the notes cover the whole rc series rather than only
          # what changed since the previous rc.
          FROM_TAG="$CURRENT_TAG_VERSION"
          if [ "$SEMVER_UPDATE" = 'release' ]; then FROM_TAG="$CURRENT_STABLE_TAG_VERSION"; fi
          node scripts/generate-changelog.js "$FROM_TAG" "$VERSION" "$SEMVER_UPDATE" > "${{ runner.temp }}/changelog.txt"
          # Records that this commit was produced by the publish workflow rather
          # than typed by hand. GitHub renders it as a co-author on the commit.
          printf '\nCo-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>\n' >> "${{ runner.temp }}/changelog.txt"
          git commit --amend -F "${{ runner.temp }}/changelog.txt"
          git tag -f -m "$VERSION" "v$VERSION"
          git show -s --format=%B
      # Runs on dry runs too, and deliberately before the push: a packaging
      # problem, an already-published version or a bad npm token then fails the
      # run while nothing has left the runner, rather than stranding a pushed
      # tag with no package on npm. `npm whoami` is here because a dry-run
      # publish exits 0 with no credentials at all — it only warns.
      - name: Verify publish will work
        run: |
          npm whoami
          npm publish --tag "$NPM_DIST_TAG" --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
      - name: Push new version
        if: inputs.dry_run == false
        run: git push --atomic origin ${{ github.ref_name }} $(git tag --points-at HEAD)
      # --dry-run still negotiates with the remote, so a tag that already exists
      # upstream is caught here rather than on the real run.
      - name: Push new version (dry run)
        if: inputs.dry_run == true
        run: git push --atomic --dry-run origin ${{ github.ref_name }} $(git tag --points-at HEAD)
      - name: Publish to npm
        if: inputs.dry_run == false
        run: npm publish --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

  # Only on a real run: a dry run never pushes the tag, so there'd be nothing
  # for github-release.yml to check out.
  github-release:
    needs: publish-npm
    if: inputs.dry_run == false
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.publish-npm.outputs.tag }}
      draft: ${{ inputs.draft }}
