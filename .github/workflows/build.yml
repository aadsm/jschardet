name: Build
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  # Every branch, not just the default one: work here lands by pushing a
  # branch directly and opening a PR later, if at all, so a default-branch
  # filter would leave that work unbuilt — which is how eight commits reached
  # update-chardet-7.6.0 without a single run.
  push:
# A branch that is pushed and then PR'd fires both triggers; same ref, same
# group, so the older run is cancelled rather than duplicating the work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Before the tests, not after: tests/packaging.test.ts exercises
      # build/index.cjs and build/index.d.cts, which only these two scripts
      # produce. build/ is gitignored, so on a fresh checkout they do not
      # exist and those tests fail on an artefact that is missing rather
      # than on the code under test.
      - run: npm run build:bundles && npm run build:types
      - name: Check dist files match source
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git diff --stat --no-color --exit-code \
          || (echo "dist files at $COMMIT_URL do not match source. Run 'npm run build && npm run build:bundles && npm run build:types' and commit." && exit 1)
      - run: npm test
      - run: npm run test:browser
      # Assembles the tarball exactly as `npm publish` would, without writing or
      # uploading it, and logs its contents and size. A `files` glob that stopped
      # matching, or a `bin` path that isn't shipped, fails here rather than at
      # release time. Reuses what this job already built: no prepublishOnly.
      - name: Check package contents
        run: npm pack --dry-run
