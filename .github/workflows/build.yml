name: Build
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - run: npm run build:bundles && npm run build:types
      - name: Check dist files match source
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git diff --stat --no-color --exit-code \
          || (echo "dist files at $COMMIT_URL do not match source. Run 'npm run build && npm run build:bundles && npm run build:types' and commit." && exit 1)
      # Assembles the tarball exactly as `npm publish` would, without writing or
      # uploading it, and logs its contents and size. A `files` glob that stopped
      # matching, or a `bin` path that isn't shipped, fails here rather than at
      # release time. Reuses what this job already built: no prepublishOnly.
      - name: Check package contents
        run: npm pack --dry-run
